<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #username-page, #chat-page {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        #usernameForm {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"], textarea {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        #messageArea {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .event-message {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin: 10px 0;
        }

        .chat-message {
            margin-bottom: 15px;
        }

        .chat-message .username {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .chat-message .message-content {
            background: white;
            padding: 10px;
            border-radius: 5px;
            word-wrap: break-word;
        }

        #messageForm {
            display: flex;
            gap: 10px;
        }

        #message {
            flex: 1;
        }

        #connecting {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        /* Duplicate login notification */
        .duplicate-notification {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }

        .duplicate-notification .title {
            font-weight: bold;
            color: #856404;
            margin-bottom: 10px;
        }

        .duplicate-notification .message {
            color: #856404;
            margin-bottom: 15px;
        }

        .duplicate-buttons {
            display: flex;
            gap: 10px;
        }

        .duplicate-buttons button {
            flex: 1;
            padding: 10px;
        }

        .btn-continue {
            background: #51cf66;
        }

        .btn-continue:hover {
            background: #40c057;
        }

        .btn-keep {
            background: #ff6b6b;
        }

        .btn-keep:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <div id="username-page">
        <h1>Enter Your Username</h1>
        <form id="usernameForm">
            <input type="text" id="name" placeholder="Enter your username" required autocomplete="off">
            <button type="submit">Start Chatting</button>
        </form>
    </div>

    <div id="chat-page" class="hidden">
        <h1>WebSocket Chat</h1>
        <div id="messageArea"></div>
        <form id="messageForm">
            <input type="text" id="message" placeholder="Type a message..." required autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        let stompClient = null;
        let username = null;
        let newSessionId = null;

        const usernamePage = document.querySelector('#username-page');
        const chatPage = document.querySelector('#chat-page');
        const usernameForm = document.querySelector('#usernameForm');
        const messageForm = document.querySelector('#messageForm');
        const messageInput = document.querySelector('#message');
        const messageArea = document.querySelector('#messageArea');

        function connect(event) {
            event.preventDefault();
            username = document.querySelector('#name').value.trim();

            if (username) {
                usernamePage.classList.add('hidden');
                chatPage.classList.remove('hidden');

                const socket = new SockJS('http://localhost:8080/ws');
                stompClient = Stomp.over(socket);

                stompClient.connect({}, onConnected, onError);
            }
        }

        function onConnected() {
            console.log('WebSocket connected!');
            
            // Subscribe to the public topic
            stompClient.subscribe('/topic/public', onMessageReceived);
            console.log('Subscribed to /topic/public');
            
            // Subscribe to personal notifications
            const subscription = stompClient.subscribe('/user/queue/notification', onPersonalNotification);
            console.log('Subscribed to /user/queue/notification', subscription);

            // Tell the server the username
            stompClient.send("/app/chat.addUser",
                {},
                JSON.stringify({sender: username, type: 'JOIN'})
            );
            console.log('Sent addUser message for:', username);
        }

        function onError(error) {
            messageArea.innerHTML = '<div class="event-message">Could not connect to WebSocket server. Please refresh this page to try again!</div>';
        }

        function sendMessage(event) {
            event.preventDefault();
            const messageContent = messageInput.value.trim();

            if (messageContent && stompClient) {
                const chatMessage = {
                    sender: username,
                    content: messageContent,
                    type: 'CHAT'
                };
                stompClient.send("/app/chat.sendMessage", {}, JSON.stringify(chatMessage));
                messageInput.value = '';
            }
        }

        function onPersonalNotification(payload) {
            console.log('Personal notification received:', payload);
            const message = JSON.parse(payload.body);
            console.log('Parsed message:', message);
            
            if (message.type === 'DUPLICATE_LOGIN') {
                console.log('Duplicate login detected! New session ID:', message.sessionId);
                // Store the new session ID
                newSessionId = message.sessionId;
                // Show notification in chat area
                showDuplicateLoginNotification();
            } else if (message.type === 'FORCE_LOGOUT') {
                console.log('Force logout received:', message.content);
                // Force logout this session
                logout(message.content);
            }
        }

        function showDuplicateLoginNotification() {
            const notificationDiv = document.createElement('div');
            notificationDiv.classList.add('duplicate-notification');
            notificationDiv.innerHTML = `
                <div class="title">⚠️ Another user logged in with your username</div>
                <div class="message">Choose what to do:</div>
                <div class="duplicate-buttons">
                    <button class="btn-continue" onclick="handleContinue()">Continue with New Session</button>
                    <button class="btn-keep" onclick="handleKeep()">Keep This Session</button>
                </div>
            `;
            messageArea.appendChild(notificationDiv);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        function handleContinue() {
            if (stompClient && newSessionId) {
                // Send choice to server
                stompClient.send("/app/chat.sessionChoice", {},
                    JSON.stringify({
                        sender: username,
                        content: 'continue',
                        sessionId: newSessionId,
                        type: 'CHAT'
                    })
                );
                
                // This session will be logged out by server
                setTimeout(() => {
                    logout('Continuing with new session...');
                }, 500);
            }
        }

        function handleKeep() {
            if (stompClient && newSessionId) {
                // Send choice to server
                stompClient.send("/app/chat.sessionChoice", {},
                    JSON.stringify({
                        sender: username,
                        content: 'keep',
                        sessionId: newSessionId,
                        type: 'CHAT'
                    })
                );
                
                // Remove the notification from UI
                const notification = document.querySelector('.duplicate-notification');
                if (notification) {
                    notification.remove();
                }
                newSessionId = null;
            }
        }

        function logout(reason) {
            if (stompClient) {
                stompClient.disconnect();
            }
            
            chatPage.classList.add('hidden');
            usernamePage.classList.remove('hidden');
            messageArea.innerHTML = '';
            
            if (reason) {
                alert(reason);
            }
        }

        function onMessageReceived(payload) {
            const message = JSON.parse(payload.body);
            const messageElement = document.createElement('div');

            if (message.type === 'JOIN') {
                messageElement.classList.add('event-message');
                messageElement.textContent = message.sender + ' joined!';
            } else if (message.type === 'LEAVE') {
                messageElement.classList.add('event-message');
                messageElement.textContent = message.sender + ' left!';
            } else {
                messageElement.classList.add('chat-message');
                
                const usernameElement = document.createElement('div');
                usernameElement.classList.add('username');
                usernameElement.textContent = message.sender;
                messageElement.appendChild(usernameElement);

                const contentElement = document.createElement('div');
                contentElement.classList.add('message-content');
                contentElement.textContent = message.content;
                messageElement.appendChild(contentElement);
            }

            messageArea.appendChild(messageElement);
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        usernameForm.addEventListener('submit', connect);
        messageForm.addEventListener('submit', sendMessage);
    </script>
</body>
</html>
