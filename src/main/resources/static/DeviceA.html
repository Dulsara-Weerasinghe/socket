<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Device A (Active Session)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input { margin: 4px 0; padding: 6px; width: 260px; }
    button { padding: 8px 12px; margin-right: 8px; }
    pre { background: #f6f6f6; padding: 10px; }
    .card { border: 1px solid #ddd; padding: 12px; margin-top: 12px; }
  </style>
</head>
<body>
<h2>Device A (Already Logged In)</h2>

<div class="card">
  <div><b>Login (to get JWT)</b></div>
  <input id="username" placeholder="username" value="alice" />
  <input id="password" placeholder="password" value="pass" type="password" />
  <button onclick="loginA()">Login + Connect WS</button>
  <div id="loginStatus"></div>
</div>

<div class="card">
  <div><b>WebSocket / Alerts</b></div>
  <div>Status: <span id="wsStatus">DISCONNECTED</span></div>
  <div id="alertBox"></div>
</div>

<h3>Logs</h3>
<pre id="log"></pre>

<!-- STOMP client (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>
  const API = "http://localhost:8080";
  let token = null;
  let stompClient = null;
  let lastChallengeId = null;

  function log(msg) {
    const el = document.getElementById("log");
    el.textContent += msg + "\n";
  }

  async function loginA() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const res = await fetch(API + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (data.status !== "OK") {
      document.getElementById("loginStatus").textContent =
        "Login did not return OK (for Device A, try when not already online): " + JSON.stringify(data);
      log("Login response: " + JSON.stringify(data));
      return;
    }

    token = data.accessToken;
    document.getElementById("loginStatus").textContent = "Logged in. Token acquired.";
    log("Token: " + token);

    connectWS();
  }

  function connectWS() {
    // Pass token as query param for handshake (matches backend interceptor)
    const wsUrl = "ws://localhost:8080/ws?token=" + encodeURIComponent(token);

    stompClient = new StompJs.Client({
      brokerURL: wsUrl,
      reconnectDelay: 2000,
      debug: (str) => log("[STOMP] " + str),
    });

    stompClient.onConnect = () => {
      document.getElementById("wsStatus").textContent = "CONNECTED";
      log("WS connected");

      // Subscribe to user-specific queue
      stompClient.subscribe("/user/queue/login-alerts", (message) => {
        const payload = JSON.parse(message.body);
        log("Received alert: " + JSON.stringify(payload));
        showAlert(payload);
      });
    };

    stompClient.onWebSocketClose = () => {
      document.getElementById("wsStatus").textContent = "DISCONNECTED";
      log("WS closed");
    };

    stompClient.onStompError = (frame) => {
      log("Broker error: " + frame.headers["message"]);
      log("Details: " + frame.body);
    };

    stompClient.activate();
    document.getElementById("wsStatus").textContent = "CONNECTING...";
  }

  function showAlert(payload) {
    lastChallengeId = payload.challengeId;

    const box = document.getElementById("alertBox");
    box.innerHTML = `
      <div style="margin-top:10px;">
        <div><b>New login attempt!</b></div>
        <div>challengeId: ${payload.challengeId}</div>
        <div>ip: ${payload.ip || "-"}</div>
        <div>userAgent: ${(payload.userAgent || "-").replace(/</g,"&lt;")}</div>
        <div>createdAt: ${payload.createdAt}</div>
        <div>expiresAt: ${payload.expiresAt}</div>
        <div style="margin-top:10px;">
          <button onclick="respond('APPROVE')">Approve</button>
          <button onclick="respond('DENY')">Deny</button>
        </div>
      </div>
    `;
  }

  async function respond(decision) {
    if (!lastChallengeId) return alert("No challengeId yet!");
    const res = await fetch(API + `/login-challenges/${lastChallengeId}/respond`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ decision })
    });
    const data = await res.json();
    log("Respond result: " + JSON.stringify(data));
    alert("Decision sent: " + decision + " → status: " + data.status);
  }
</script>
</body>
</html>
